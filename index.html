<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4CAF50">
  <title>Kalkulator Premii</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Guard: redirect to main panel if not authenticated
    if (sessionStorage.getItem('skyapp_auth') !== '1') {
      window.location.replace('https://andrzejdlu-ops.github.io/');
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f0f0;
      min-height: 100dvh;
      padding: 16px 16px 40px;
    }

    .tabs {
      display: flex;
      background: #fff;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .tab {
      flex: 1; padding: 10px; text-align: center; border-radius: 9px;
      font-size: .9rem; font-weight: 600; cursor: pointer; color: #888;
      transition: background .2s, color .2s; border: none; background: none;
    }
    .tab.active { background: #4CAF50; color: #fff; }

    .screen { display: none; }
    .screen.active { display: block; }

    .card {
      background: #fff; border-radius: 12px; padding: 16px;
      margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .section-title {
      font-size: .8rem; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px;
    }
    label { display: block; font-size: .85rem; color: #555; margin-bottom: 4px; }

    input[type="number"], input[type="text"], input[type="month"] {
      width: 100%; padding: .55em .75em; border: 1.5px solid #ddd;
      border-radius: .5em; font-size: 1rem; outline: none;
      transition: border-color .2s; background: #fff;
    }
    input:focus { border-color: #4CAF50; }

    textarea {
      width: 100%; padding: .6em .75em; border: 1.5px solid #ddd;
      border-radius: .5em; font-size: .85rem; outline: none;
      font-family: 'Consolas', monospace; resize: vertical;
      background: #fafafa; color: #333; margin-bottom: 8px;
    }
    textarea:focus { border-color: #4CAF50; }

    .col-labels { display: flex; gap: .4em; margin-bottom: 4px; padding-right: 2.4em; }
    .col-labels span { font-size: .78rem; color: #888; }
    .col-labels span:first-child { flex: 2; min-width: 0; }
    .col-labels span:nth-child(2) { width: 4em; flex-shrink: 0; text-align: center; }
    .col-labels span:last-child { min-width: 7em; text-align: right; }

    #people-list { display: flex; flex-direction: column; }

    .person-row {
      display: flex; align-items: center; gap: .4em;
      padding: .3em 0; border-bottom: 1px solid #f0f0f0;
    }
    .person-row:last-child { border-bottom: none; }
    .person-row .name-input { flex: 2; min-width: 0; }
    .person-row .abs-input { width: 4em; flex-shrink: 0; }
    .result-badge {
      background: #e8f5e9; color: #2e7d32; font-weight: 700;
      font-size: .95rem; padding: .35em .85em; border-radius: 2em;
      min-width: 7em; text-align: right; white-space: nowrap;
    }
    .result-badge:empty { background: transparent; color: transparent; }
    .btn-remove {
      background: #ffebee; color: #c62828; border: none; border-radius: 50%;
      width: 2em; height: 2em; font-size: 1rem; cursor: pointer;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .btn-add {
      width: 100%; padding: .75em; background: #fff; border: 2px dashed #bbb;
      border-radius: .65em; font-size: .95rem; color: #777; cursor: pointer;
      margin-top: .5em; transition: border-color .2s, color .2s;
    }
    .btn-add:hover { border-color: #4CAF50; color: #4CAF50; }

    .btn-row { display: flex; gap: 10px; }
    .btn-calc {
      flex: 1; padding: 16px; background: #4CAF50; color: #fff; border: none;
      border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: background .2s;
    }
    .btn-calc:hover { background: #388e3c; }

    .btn-save {
      flex: 1; padding: 16px; background: #1976D2; color: #fff; border: none;
      border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
      transition: background .2s; display: none;
    }
    .btn-save.visible { display: block; }
    .btn-save:hover { background: #1565C0; }
    .btn-save:disabled { background: #90a4ae; cursor: default; }

    .total-card {
      background: #4CAF50; color: #fff; border-radius: 12px; padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .total-card span:first-child { font-size: .95rem; opacity: .9; }
    .total-card span:last-child { font-size: 1.4rem; font-weight: 700; }

    /* toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333; color: #fff; padding: 12px 24px;
      border-radius: 24px; font-size: .9rem; transition: transform .3s;
      z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* font size slider */
    .size-bar {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border-radius: 12px; padding: 10px 14px;
      margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .size-bar span { font-size: .78rem; color: #888; white-space: nowrap; }
    .size-bar input[type="range"] {
      flex: 1; height: 4px; accent-color: #4CAF50;
      cursor: pointer; border: none; background: none; padding: 0;
    }
    .size-label { font-size: .78rem; color: #4CAF50; font-weight: 700; min-width: 2.5em; text-align: right; }

    /* header */
    .app-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }
    .btn-back {
      display: flex; align-items: center; gap: 6px;
      background: #fff; border: 1.5px solid #ddd; border-radius: 10px;
      padding: 8px 14px; font-size: .88rem; font-weight: 600;
      color: #555; cursor: pointer; text-decoration: none;
      transition: border-color .2s, color .2s;
      white-space: nowrap;
    }
    .btn-back:hover { border-color: #4CAF50; color: #2e7d32; }
    .app-title { font-size: 1.1rem; font-weight: 700; color: #1a1a1a; }

    /* historia */
    .history-empty { text-align: center; color: #aaa; padding: 40px 0; font-size: .95rem; }
    .history-loading { text-align: center; color: #aaa; padding: 40px 0; font-size: .95rem; }

    .history-item {
      background: #fff; border-radius: 12px; margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden;
    }
    .history-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; cursor: pointer; user-select: none;
    }
    .history-header:hover { background: #f9f9f9; }
    .history-meta { display: flex; flex-direction: column; gap: 2px; }
    .history-date { font-weight: 700; font-size: 1rem; color: #222; }
    .history-sum { font-size: .82rem; color: #4CAF50; font-weight: 600; }
    .history-arrow { color: #aaa; font-size: 1.1rem; transition: transform .2s; }
    .history-item.open .history-arrow { transform: rotate(90deg); }

    .history-body { display: none; border-top: 1px solid #f0f0f0; }
    .history-item.open .history-body { display: block; }

    .history-info {
      display: flex; gap: 16px; padding: 10px 16px;
      background: #f9f9f9; font-size: .82rem; color: #666;
    }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th {
      text-align: left; padding: 8px 16px; font-size: .78rem;
      color: #888; font-weight: 600; border-bottom: 1px solid #f0f0f0;
    }
    .history-table td {
      padding: 9px 16px; font-size: .9rem; border-bottom: 1px solid #f5f5f5;
    }
    .history-table td:last-child { text-align: right; font-weight: 600; color: #2e7d32; }
    .history-table tr:last-child td { border-bottom: none; }

    .history-actions {
      display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #f0f0f0;
    }
    .btn-load {
      flex: 1; padding: 9px; background: #e3f2fd; color: #1565C0;
      border: none; border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer;
    }
    .btn-delete {
      padding: 9px 16px; background: #ffebee; color: #c62828;
      border: none; border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer;
    }

    .top-bar { margin-bottom: 12px; }
    .top-bar .app-header { margin-bottom: 0; }
    .top-bar .size-bar { margin-bottom: 0; }
    .calc-grid { display: flex; flex-direction: column; }

    @media (min-width: 700px) {
      body { max-width: 980px; margin: 0 auto; padding: 12px 20px 20px; }
      .top-bar { display: flex; align-items: center; gap: 12px; }
      .top-bar .app-header { flex: 1; }
      .calc-grid {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-areas: "left right" "bottom bottom";
        gap: 12px;
        align-items: start;
      }
      .calc-left { grid-area: left; }
      .calc-right { grid-area: right; }
      .calc-bottom { grid-area: bottom; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="app-header">
    <a class="btn-back" href="https://andrzejdlu-ops.github.io/">← Menu</a>
    <span class="app-title">Kalkulator Premii</span>
  </div>
  <div class="size-bar">
    <span>A</span>
    <input type="range" id="font-slider" min="12" max="22" step="1" value="16"
           oninput="setFontSize(this.value)">
    <span style="font-size:1.1rem">A</span>
    <span class="size-label" id="font-label">16px</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-calc" onclick="showScreen('calc')">Kalkulator</button>
  <button class="tab" id="tab-history" onclick="showScreen('history')">Historia</button>
</div>

<!-- KALKULATOR -->
<div id="screen-calc" class="screen active">
  <div class="calc-grid">
    <div class="calc-left">
      <div class="card">
        <label>Miesiąc</label>
        <input type="month" id="data-obliczenia" onchange="updateDniFromMonth()">
      </div>
      <div class="card">
        <label>Kwota premii (pula)</label>
        <input type="number" id="kwota" value="0" min="0" step="0.01" placeholder="np. 5000">
      </div>
      <div class="card">
        <label>Dni robocze w miesiącu</label>
        <input type="number" id="dni" value="22" min="1" max="31">
      </div>
    </div>
    <div class="calc-right">
      <div class="card">
        <div class="section-title">Pracownicy</div>
        <div class="col-labels">
          <span>Imię / Nazwisko</span>
          <span>Nieob.</span>
          <span>Premia</span>
        </div>
        <div id="people-list"></div>
        <button class="btn-add" onclick="addPerson()">+ Dodaj osobę</button>
      </div>
    </div>
    <div class="calc-bottom">
      <div id="total-card" class="total-card" style="display:none;">
        <span>Łącznie wypłacono</span>
        <span id="total-val">0,00 zł</span>
      </div>
      <div class="btn-row">
        <button class="btn-calc" onclick="calculate()">Oblicz</button>
        <button class="btn-save" id="btn-save" onclick="saveResult()" style="display:none;">Zapisz</button>
      </div>
      <div class="card" id="excel-card" style="display:none;">
        <div class="section-title">Do wklejenia w Excelu</div>
        <textarea id="excel-text" readonly rows="6"></textarea>
        <button class="btn-add" onclick="copyExcelText()">📋 Kopiuj do schowka</button>
      </div>
    </div>
  </div>
</div>

<!-- HISTORIA -->
<div id="screen-history" class="screen">
  <div id="history-list"><div class="history-loading">Ładowanie...</div></div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // ---- Firebase init ----
  const firebaseConfig = {
    apiKey: "AIzaSyAOvcYscDDg4BI9cbzpiXL4xJDnemusoGI",
    authDomain: "kalkulator-premii-b13ff.firebaseapp.com",
    projectId: "kalkulator-premii-b13ff",
    storageBucket: "kalkulator-premii-b13ff.firebasestorage.app",
    messagingSenderId: "566707019483",
    appId: "1:566707019483:web:c04eb219eda3011ab9b6fe"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const COL = 'obliczenia';

  // Firestore rules require request.auth != null — sign in anonymously before any read/write.
  const authReady = auth.signInAnonymously().catch(e => {
    console.error('Auth error:', e);
    toast('Błąd autoryzacji: ' + e.message);
  });

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // Safe for embedding inside a single-quoted JS string literal that itself sits inside
  // an HTML attribute (e.g. onclick="fn('${escJsAttr(x)}')") — escapes JS quote/backslash
  // first, then HTML-escapes the result for the attribute context.
  function escJsAttr(s) {
    const jsEscaped = String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    return esc(jsEscaped);
  }

  const DEFAULT = [
    "Izabela","Monika U.","Julia","Joanna",
    "Paulina","Monika Ż.","Monika K.","Wiktoria"
  ];

  let lastResult = null;

  // ---- helpers ----
  function fmt(n) {
    n = Number(n) || 0;
    return n.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' zł';
  }
  function fmtMonth(ym) {
    if (!ym || typeof ym !== 'string' || !/^\d{4}-(0[1-9]|1[0-2])$/.test(ym)) return '—';
    const [y, m] = ym.split('-');
    const names = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec',
                   'Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
    return names[parseInt(m) - 1] + ' ' + y;
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
    if (name === 'history') renderHistory();
  }

  // ---- people ----
  function addPerson(name = '', absVal = 0, resultText = '') {
    const list = document.getElementById('people-list');
    const div = document.createElement('div');
    div.className = 'person-row';
    div.innerHTML = `
      <input type="text" placeholder="Imię" value="${esc(name)}" class="name-input" maxlength="60">
      <input type="number" placeholder="0" value="${Math.max(0, parseInt(absVal) || 0)}" min="0" class="abs-input">
      <span class="result-badge">${esc(resultText)}</span>
      <button class="btn-remove" onclick="removePerson(this)">✕</button>`;
    list.appendChild(div);
  }

  function removePerson(btn) {
    btn.closest('.person-row').remove();
    if (document.querySelector('.result-badge:not(:empty)')) calculate();
  }

  // ---- calculate ----
  function calculate() {
    const kwota = parseFloat(document.getElementById('kwota').value) || 0;
    const dni   = parseInt(document.getElementById('dni').value) || 0;
    if (dni <= 0) { alert('Podaj liczbę dni roboczych.'); return; }

    const cards = [...document.querySelectorAll('.person-row')];
    if (!cards.length) { alert('Dodaj co najmniej jedną osobę.'); return; }

    const absences = cards.map(c => Math.max(0, parseInt(c.querySelector('.abs-input').value) || 0));
    const n = cards.length;
    const dailyPerPerson = kwota / (n * dni);
    const totalAbsences = absences.reduce((a, b) => a + b, 0);

    const wyniki = [];
    cards.forEach((card, i) => {
      const own  = dailyPerPerson * (dni - absences[i]);
      const gain = n > 1 ? dailyPerPerson * (totalAbsences - absences[i]) / (n - 1) : 0;
      const bonus = Math.max(0, own + gain);
      const imie = card.querySelector('.name-input').value || ('Osoba ' + (i + 1));
      card.querySelector('.result-badge').textContent = fmt(bonus);
      wyniki.push({ imie, nieobecnosci: absences[i], premia: Math.round(bonus * 100) / 100 });
    });

    document.getElementById('total-val').textContent = fmt(kwota);
    document.getElementById('total-card').style.display = 'flex';
    document.getElementById('btn-save').style.display = 'block';

    updateExcelText(wyniki);

    lastResult = {
      data: document.getElementById('data-obliczenia').value,
      kwota,
      dni,
      wyniki,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
  }

  // ---- kopiowanie do Excela (TSV — Excel sam rozdzieli taby na kolumny) ----
  function updateExcelText(wyniki) {
    const clean = s => String(s).replace(/[\t\r\n]/g, ' ').trim();
    const names = wyniki.map(w => clean(w.imie));
    // dopelnienie spacjami do stalej szerokosci — sam tabulator nie wyrownuje
    // wizualnie kolumn o roznej dlugosci tekstu; nadal jeden tab na wiersz,
    // wiec w Excelu i tak wpada do dwoch kolumn
    const width = Math.max('Imię'.length, ...names.map(n => n.length)) + 3;
    const header = 'Imię'.padEnd(width) + '\t' + 'Premia';
    const rows = wyniki.map((w, i) => names[i].padEnd(width) + '\t' +
      w.premia.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
    document.getElementById('excel-text').value = [header, ...rows].join('\n');
    document.getElementById('excel-card').style.display = 'block';
  }

  async function copyExcelText() {
    const ta = document.getElementById('excel-text');
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try {
      await navigator.clipboard.writeText(ta.value);
      toast('Skopiowano ✓ — wklej w Excelu (Ctrl+V)');
    } catch (e) {
      try {
        document.execCommand('copy');
        toast('Skopiowano ✓ — wklej w Excelu (Ctrl+V)');
      } catch (e2) {
        toast('Nie udało się skopiować — zaznacz tekst ręcznie i Ctrl+C');
      }
    }
  }

  // ---- save to Firestore ----
  async function saveResult() {
    if (!lastResult) return;
    if (!lastResult.data) { toast('Wybierz miesiąc przed zapisem.'); return; }
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Zapisywanie...';
    try {
      await authReady;
      // ID dokumentu = miesiąc (np. "2026-08") — nadpisuje jeśli istnieje
      await db.collection(COL).doc(lastResult.data).set(lastResult);
      toast('Zapisano w chmurze ✓');
      btn.style.display = 'none';
      lastResult = null;
    } catch (e) {
      toast('Błąd zapisu: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Zapisz';
    }
  }

  // ---- history from Firestore ----
  async function renderHistory() {
    const container = document.getElementById('history-list');
    container.innerHTML = '<div class="history-loading">Ładowanie z chmury...</div>';
    try {
      await authReady;
      const snap = await db.collection(COL).orderBy('data', 'desc').get();
      if (snap.empty) {
        container.innerHTML = '<div class="history-empty">Brak zapisanych obliczeń.<br>Wróć do kalkulatora i kliknij <b>Zapisz</b>.</div>';
        return;
      }
      const entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      container.innerHTML = entries.map((entry, idx) => `
        <div class="history-item" id="hi-${idx}">
          <div class="history-header" onclick="toggleHistory(${idx})">
            <div class="history-meta">
              <span class="history-date">${esc(fmtMonth(entry.data) || 'Bez daty')}</span>
              <span class="history-sum">Pula: ${esc(fmt(entry.kwota))}</span>
            </div>
            <span class="history-arrow">▶</span>
          </div>
          <div class="history-body">
            <div class="history-info">
              <span>Dni robocze: <b>${esc(entry.dni)}</b></span>
              <span>Pracownicy: <b>${esc(entry.wyniki.length)}</b></span>
            </div>
            <table class="history-table">
              <thead><tr><th>Imię</th><th>Nieob.</th><th>Premia</th></tr></thead>
              <tbody>
                ${entry.wyniki.map(w => `
                  <tr>
                    <td>${esc(w.imie)}</td>
                    <td>${esc(w.nieobecnosci)}</td>
                    <td>${esc(fmt(w.premia))}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
            <div class="history-actions">
              <button class="btn-load" onclick="loadEntry(${idx})">Wczytaj do kalkulatora</button>
              <button class="btn-delete" onclick="deleteEntry('${escJsAttr(entry.id)}', ${idx})">Usuń</button>
            </div>
          </div>
        </div>`).join('');

      // store entries for loadEntry
      window._historyEntries = entries;
    } catch (e) {
      container.innerHTML = `<div class="history-empty">Błąd ładowania: ${esc(e.message)}</div>`;
    }
  }

  function toggleHistory(idx) {
    document.getElementById('hi-' + idx).classList.toggle('open');
  }

  function loadEntry(idx) {
    const entry = window._historyEntries[idx];
    document.getElementById('kwota').value = entry.kwota;
    document.getElementById('dni').value = entry.dni;
    document.getElementById('data-obliczenia').value = entry.data || '';
    document.getElementById('people-list').innerHTML = '';
    entry.wyniki.forEach(w => addPerson(w.imie, w.nieobecnosci));
    document.getElementById('total-card').style.display = 'none';
    document.getElementById('btn-save').style.display = 'none';
    document.getElementById('excel-card').style.display = 'none';
    lastResult = null;
    showScreen('calc');
    toast('Wczytano obliczenie ✓');
  }

  async function deleteEntry(firestoreId, idx) {
    if (!confirm('Usunąć to obliczenie?')) return;
    try {
      await authReady;
      await db.collection(COL).doc(firestoreId).delete();
      toast('Usunięto ✓');
      renderHistory();
    } catch (e) {
      toast('Błąd usuwania: ' + e.message);
    }
  }

  // ---- font size ----
  function setFontSize(px) {
    px = parseInt(px);
    document.documentElement.style.fontSize = px + 'px';
    document.getElementById('font-label').textContent = px + 'px';
    document.getElementById('font-slider').value = px;
    localStorage.setItem('skyapp_fs', px);
  }

  // ---- dni robocze (pn-pt, bez polskich swiat ustawowo wolnych) ----
  function getEasterSunday(year) {
    // algorytm Meeusa/Jonesa/Butchera
    const a = year % 19, b = Math.floor(year / 100), c = year % 100;
    const d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31);
    const day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(year, month - 1, day);
  }

  function getPolishHolidays(year) {
    const easter = getEasterSunday(year);
    const addDays = (date, days) => { const d = new Date(date); d.setDate(d.getDate() + days); return d; };
    const fixed = [[0,1],[0,6],[4,1],[4,3],[7,15],[10,1],[10,11],[11,25],[11,26]]
      .map(([m, d]) => new Date(year, m, d));
    const movable = [addDays(easter, 1), addDays(easter, 60)]; // Poniedzialek Wielkanocny, Boze Cialo
    return [...fixed, ...movable];
  }

  function countWorkingDays(year, month /* 1-12 */) {
    const holidays = new Set(getPolishHolidays(year).map(d => d.toDateString()));
    const daysInMonth = new Date(year, month, 0).getDate();
    let count = 0;
    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month - 1, day);
      const dow = date.getDay(); // 0 = niedziela, 6 = sobota
      if (dow === 0 || dow === 6) continue;
      if (holidays.has(date.toDateString())) continue;
      count++;
    }
    return count;
  }

  function updateDniFromMonth() {
    const val = document.getElementById('data-obliczenia').value;
    if (!/^\d{4}-\d{2}$/.test(val)) return;
    const [y, m] = val.split('-').map(Number);
    document.getElementById('dni').value = countWorkingDays(y, m);
  }

  // ---- init ----
  (function init() {
    const now = new Date();
    const ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    document.getElementById('data-obliczenia').value = ym;
    updateDniFromMonth();
    DEFAULT.forEach(n => addPerson(n));

    // restore saved font size
    const saved = localStorage.getItem('skyapp_fs');
    if (saved) setFontSize(saved);
  })();
</script>
